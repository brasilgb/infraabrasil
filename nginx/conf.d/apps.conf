upstream vetoros_php { server vetoros:9000; }
upstream vetorpet_php { server vetorpet:9000; }
upstream abrasilsistema_php { server abrasilsistema:9000; }
server {
    listen 80 default_server; server_name vetoros.localhost; root /var/www/vetoros/public;
    include /etc/nginx/conf.d/laravel.inc;
    location /build/ { alias /var/www/vetoros/build/; try_files $uri =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/vetoros/public$fastcgi_script_name; fastcgi_pass vetoros_php; }
}
server {
    listen 80; server_name vetorpet.localhost; root /var/www/vetorpet/public;
    include /etc/nginx/conf.d/laravel.inc;
    location /build/ { alias /var/www/vetorpet/build/; try_files $uri =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/vetorpet/public$fastcgi_script_name; fastcgi_pass vetorpet_php; }
}
server {
    listen 80; server_name abrasilsistema.localhost; root /var/www/abrasilsistema/public;
    include /etc/nginx/conf.d/laravel.inc;
    location /build/ { alias /var/www/abrasilsistema/build/; try_files $uri =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/abrasilsistema/public$fastcgi_script_name; fastcgi_pass abrasilsistema_php; }
}
server { listen 80; server_name waha.localhost; location / { proxy_pass http://waha:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } }
server { listen 80; server_name _; location = /healthz { return 200 'ok\n'; add_header Content-Type text/plain; } return 444; }
