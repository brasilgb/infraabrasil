# DNS interno do Docker, reconsultado a cada 10s: upstreams em variáveis são
# resolvidos em runtime, então recriar um container (IP novo) não exige reload.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# --- Dev local (*.localhost), HTTP puro, sem TLS ---
server {
    listen 80; server_name vetoros.localhost; root /var/www/vetoros/public;
    include /etc/nginx/conf.d/laravel.inc;
    location /build/ { alias /var/www/vetoros/build/; try_files $uri =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name; set $php_upstream vetoros:9000; fastcgi_pass $php_upstream; }
}
server {
    listen 80; server_name vetorpet.localhost; root /var/www/vetorpet/public;
    include /etc/nginx/conf.d/laravel.inc;
    location /build/ { alias /var/www/vetorpet/build/; try_files $uri =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name; set $php_upstream vetorpet:9000; fastcgi_pass $php_upstream; }
}
server {
    listen 80; server_name abrasilsistema.localhost; root /var/www/abrasilsistema/public;
    include /etc/nginx/conf.d/laravel.inc;
    location /build/ { alias /var/www/abrasilsistema/build/; try_files $uri =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name; set $php_upstream abrasilsistema:9000; fastcgi_pass $php_upstream; }
}
server { listen 80; server_name waha.localhost; location / { set $waha_upstream waha:3000; proxy_pass http://$waha_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } }
server { listen 80; server_name phpmyadmin.localhost; location / { set $pma_upstream phpmyadmin:80; proxy_pass http://$pma_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } }
server {
    listen 80; server_name n8n.localhost;
    include /etc/nginx/conf.d/n8n.inc;
}

# --- Produção: domínios reais com HTTPS (Let's Encrypt) ---
# HTTP: só ACME challenge + redirect para HTTPS no domínio canônico (sem www).
server {
    listen 80;
    server_name vetoros.com.br www.vetoros.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vetoros.com.br$request_uri; }
}
server {
    listen 80;
    server_name vetorpet.com.br www.vetorpet.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vetorpet.com.br$request_uri; }
}
server {
    listen 80;
    server_name abrasilsistemas.com.br www.abrasilsistemas.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://abrasilsistemas.com.br$request_uri; }
}
server {
    listen 80;
    server_name n8n.abrasilsistemas.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://n8n.abrasilsistemas.com.br$request_uri; }
}

# HTTPS: www redireciona para o apex canônico.
server {
    listen 443 ssl;
    http2 on;
    server_name www.vetoros.com.br;
    ssl_certificate /etc/letsencrypt/live/vetoros.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vetoros.com.br/privkey.pem;
    return 301 https://vetoros.com.br$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.vetorpet.com.br;
    ssl_certificate /etc/letsencrypt/live/vetorpet.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vetorpet.com.br/privkey.pem;
    return 301 https://vetorpet.com.br$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.abrasilsistemas.com.br;
    ssl_certificate /etc/letsencrypt/live/abrasilsistemas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abrasilsistemas.com.br/privkey.pem;
    return 301 https://abrasilsistemas.com.br$request_uri;
}

