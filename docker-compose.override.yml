services:
  vetorleads:
    environment:
      SUPPORT_AUTOMATION_WHATSAPP_DELIVERY_ENABLED: "false"
    image: vetorleads:pull-0a98685
    pull_policy: never
  vetorleads-worker:
    environment:
      SUPPORT_AUTOMATION_WHATSAPP_DELIVERY_ENABLED: "false"
    image: vetorleads:pull-0a98685
    pull_policy: never
    volumes:
      - ./scripts/vetorleads-process-health.php:/opt/infra/vetorleads-process-health.php:ro
    healthcheck:
      test: [CMD, php, /opt/infra/vetorleads-process-health.php, 'queue:work']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  vetorleads-scheduler:
    environment:
      SUPPORT_AUTOMATION_WHATSAPP_DELIVERY_ENABLED: "false"
    image: vetorleads:pull-0a98685
    pull_policy: never
    volumes:
      - ./scripts/vetorleads-process-health.php:/opt/infra/vetorleads-process-health.php:ro
    healthcheck:
      test: [CMD, php, /opt/infra/vetorleads-process-health.php, 'schedule:work']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  vetoros:
    image: vetoros:pull-5f7caf3
    pull_policy: never
  vetoros-worker:
    image: vetoros:pull-5f7caf3
    pull_policy: never
  vetoros-scheduler:
    image: vetoros:pull-5f7caf3
    pull_policy: never
